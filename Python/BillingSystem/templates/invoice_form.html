{% extends "base.html" %}
{% block title %}{{ 'Edit' if invoice else 'New' }} Invoice · BillDesk{% endblock %}
{% block page_title %}{{ 'Edit' if invoice else 'New' }} Invoice{% endblock %}

{% block content %}
<div class="form-panel">
  <form method="POST">

    <div class="form-group">
      <label class="form-label">Customer <span class="required">*</span></label>
      <select name="customer_id" class="form-control" {% if invoice %}disabled{% endif %}>
        <option value="">— Select customer —</option>
        {% for c in customers %}
        <option value="{{ c.id }}"
          {{ 'selected' if invoice and invoice.customer_id == c.id }}>
          {{ c.name }}
        </option>
        {% endfor %}
      </select>
      {% if invoice %}
      <input type="hidden" name="customer_id" value="{{ invoice.customer_id }}" />
      {% endif %}
    </div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <input type="text" name="description" class="form-control"
             value="{{ invoice.description if invoice else '' }}"
             placeholder="e.g. Monthly retainer — April 2024" />
    </div>

    <div class="row g-3">
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label">Amount (R) <span class="required">*</span></label>
          <input type="number" name="amount" class="form-control" step="0.01" min="0"
                 value="{{ invoice.amount if invoice else '' }}"
                 placeholder="0.00" required />
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label class="form-label">Due Date</label>
          <input type="date" name="due" class="form-control"
                 value="{{ invoice.due if invoice else '' }}" />
        </div>
      </div>
    </div>

    {% if invoice %}
    <div class="form-group">
      <label class="form-label">Status</label>
      <select name="status" class="form-control">
        {% for s in ['Pending','Paid','Overdue'] %}
        <option value="{{ s }}" {{ 'selected' if invoice.status == s }}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="form-actions">
      <a href="{{ url_for('invoices_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {{ 'Save Changes' if invoice else 'Create Invoice' }}
      </button>
    </div>

  </form>
</div>
{% endblock %}
