{% extends "base.html" %}
{% block title %}{{ 'Edit' if guest else 'Add' }} Guest · DrinkDesk{% endblock %}
{% block page_title %}{{ 'Edit' if guest else 'Add' }} Guest{% endblock %}

{% block content %}
<div class="form-panel">
  <form method="POST">

    <div class="form-group">
      <label class="form-label">Full Name <span class="required">*</span></label>
      <input type="text" name="name" class="form-control"
             value="{{ guest.name if guest else '' }}"
             placeholder="e.g. Sipho Khumalo" required />
    </div>

    <div class="form-group">
      <label class="form-label">Drink Credits <span class="required">*</span></label>
      <input type="number" name="credits" class="form-control"
             value="{{ guest.credits if guest else '5' }}"
             min="0" max="100" required />
      <div class="form-hint">How many drinks this guest is allowed.</div>
    </div>

    <div class="form-actions">
      <a href="{{ url_for('guests_list') }}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary">
        {{ 'Save Changes' if guest else 'Add Guest' }}
      </button>
    </div>

  </form>
</div>
{% endblock %}
